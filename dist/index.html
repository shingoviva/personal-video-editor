<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111312"><meta name="description" content="フォトグラファーのための、ローカル動画編集ワークスペース。"><title>PERSONAL — Video Editor</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Personal Video Editor">P<span class="brand-cut">/</span>E</a><div class="project-heading"><input id="projectName" aria-label="プロジェクト名" value="Untitled film"><span id="saveStatus">LOCAL AUTOSAVE</span></div><div class="top-actions"><button id="openProject" class="quiet">開く</button><button id="saveProject" class="quiet">保存 <kbd>⌘ S</kbd></button><button id="engineButton" class="engine-pill">BROWSER MODE</button><button id="exportButton" class="primary">書き出し <span>↗</span></button></div></header>
<nav class="workflow" aria-label="編集ステップ"><button data-tab="import" class="active"><span>01</span> IMPORT</button><button data-tab="cut"><span>02</span> CUT</button><button data-tab="motion"><span>03</span> MOTION</button><button data-tab="look"><span>04</span> LOOK</button><button data-tab="sound"><span>05</span> SOUND</button><button data-tab="text"><span>06</span> TEXT</button><button data-tab="analyze" class="analyze-tab">✧ ANALYZE</button></nav>
<main class="workspace">
<aside class="media-panel"><div class="panel-title"><span>MEDIA</span><button id="addMedia" class="icon-button" title="素材を追加" aria-label="素材を追加">＋</button></div><div id="mediaList" class="media-list"></div><button id="importSide" class="media-drop"><span>＋</span>動画を追加<small>MOV · MP4 · HEVC</small></button><div class="media-bottom"><span id="mediaCount">0 FILES</span><span>LOCAL ONLY</span></div><div class="intent-box"><label for="intent">EDITORIAL INTENT</label><select id="intent"><option>HIGH FASHION</option><option>RAW</option><option>CINEMATIC</option><option>CLUB</option><option>DOCUMENTARY</option></select><p id="intentHint">静止を長く。動きに強いコントラストを。</p></div></aside>
<section class="viewer-panel"><div class="viewer-top"><span id="viewerTitle">SOURCE MONITOR</span><div><span id="viewerMode">NO MEDIA</span><button id="compare" class="quiet" title="押している間、カラー補正前を表示">比較</button><button id="fullscreen" class="icon-button" title="フルスクリーン" aria-label="フルスクリーン">⛶</button></div></div><div id="stage" class="stage"><div id="picture" class="picture"><canvas id="previewCanvas"></canvas><div id="textOverlay"></div></div><div id="emptyState" class="empty-state"><div class="frame-symbol"><i></i><i></i><i></i><i></i><span>＋</span></div><h1>最初の素材を、ここへ。</h1><p>iPhoneの動画をドラッグ＆ドロップ</p><button id="importMain" class="primary">動画を選択</button><small>素材は外部へアップロードされません。</small></div><div id="stageNote" class="stage-note" hidden></div></div><div class="viewer-controls"><span id="sourceTime" class="mono">00:00:00.00</span><div class="transport"><button id="prevFrame" title="1フレーム戻る ←" aria-label="1フレーム戻る">❘‹</button><button id="play" class="play-button" title="再生 / 停止 Space" aria-label="再生">▶</button><button id="nextFrame" title="1フレーム進む →" aria-label="1フレーム進む">›❘</button></div><span id="outputDuration" class="mono">00:00:00.00</span></div><div class="viewer-foot"><div id="aspectButtons" class="aspect-buttons"><button data-aspect="Original" class="selected">Original</button><button data-aspect="9:16">9:16</button><button data-aspect="4:5">4:5</button><button data-aspect="1:1">1:1</button><button data-aspect="16:9">16:9</button></div><span id="previewInfo">PREVIEW</span></div></section>
<aside class="inspector"><div class="panel-title"><span id="inspectorTitle">IMPORT</span><span id="selectionLabel">—</span></div><div id="inspectorBody"></div></aside>
<section class="timeline-panel"><div class="timeline-toolbar"><div><span class="section-tag">SEQUENCE</span><button id="undo" class="icon-button" title="元に戻す ⌘Z" aria-label="元に戻す">↶</button><button id="redo" class="icon-button" title="やり直す ⌘⇧Z" aria-label="やり直す">↷</button><span class="divider"></span><button id="setIn" title="IN I">I <span>IN</span></button><button id="setOut" title="OUT O">O <span>OUT</span></button><button id="split" title="分割 S">⊣ <span>分割</span></button><button id="deleteClip" title="削除・空白を残す Delete">⌫ <span>削除</span></button><button id="ripple" title="前詰め削除 Shift+Delete">↤ <span>前詰め</span></button></div><div class="timeline-zoom"><span id="timelineCount">0 CLIPS</span><button id="zoomOut" aria-label="タイムラインを縮小">−</button><input id="timelineZoom" aria-label="タイムライン拡大率" type="range" min="1" max="10" step=".25" value="1"><button id="zoomIn" aria-label="タイムラインを拡大">＋</button></div></div><div class="timeline-layout"><div class="track-labels"><span>TIME</span><span>V1 <small>VIDEO</small></span><span>A1 <small>AUDIO</small></span><span>✧ <small>MOMENTS</small></span></div><div id="timelineScroll" class="timeline-scroll"><div id="timelineContent" class="timeline-content"><div id="ruler" class="ruler"></div><div id="videoTrack" class="video-track"></div><div id="audioTrack" class="audio-track"></div><div id="markerTrack" class="marker-track"></div><div id="playhead" class="playhead"><span></span></div><div id="timelineEmpty" class="timeline-empty">素材を追加すると、ここにシーケンスが表示されます。</div></div></div></div><div class="timeline-footer"><span id="statusLine">編集の準備ができています。</span><button id="shortcuts">KEYBOARD SHORTCUTS <kbd>?</kbd></button></div></section>
</main><video id="sourceVideo" playsinline preload="metadata" hidden></video><audio id="bgmAudio" preload="metadata"></audio><input id="filePicker" type="file" accept="video/*,.mov,.mp4,.m4v,.mkv" multiple hidden><input id="projectPicker" type="file" accept=".project,.json" hidden><input id="bgmPicker" type="file" accept="audio/*" hidden><div id="toast" class="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><script type="module" src="app.js"></script></body></html>
