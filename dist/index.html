<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111312"><meta name="description" content="フォトグラファーのための、ローカル動画編集ワークスペース。"><title>PERSONAL — Video Editor</title><link rel="stylesheet" href="style.css?v=1.7.1"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Personal Video Editor">P<span class="brand-cut">/</span>E</a><div class="project-heading"><input id="projectName" aria-label="プロジェクト名" value="Untitled film"><span id="saveStatus">LOCAL AUTOSAVE</span></div><div class="top-actions"><button id="openProject" class="quiet">開く</button><button id="saveProject" class="quiet">保存 <kbd>⌘ S</kbd></button><button id="engineButton" class="engine-pill">BROWSER MODE</button><button id="exportButton" class="primary">書き出し <span>↗</span></button></div></header>
<nav class="workflow" aria-label="編集ステップ"><button data-tab="import" class="active"><span>01</span> IMPORT</button><button data-tab="cut"><span>02</span> CUT</button><button data-tab="motion"><span>03</span> MOTION</button><button data-tab="look"><span>04</span> LOOK</button><button data-tab="sound"><span>05</span> SOUND</button><button data-tab="fx">FX</button><button data-tab="text"><span>06</span> TEXT</button><button data-tab="analyze" class="analyze-tab">✧ ANALYZE</button></nav>
<main class="workspace">
<aside class="media-panel"><div class="panel-title"><span>MEDIA</span><button id="mediaExpand" aria-label="素材パネルを広げる／戻す" aria-pressed="false">⤢</button><button id="addMedia" class="icon-button" title="素材を追加" aria-label="素材を追加">＋</button></div><div class="asset-tools"><input id="assetSearch" type="search" placeholder="素材を検索" aria-label="素材を検索"><div class="asset-filters" role="group" aria-label="素材の種類"><button data-kind="all" class="selected">すべて</button><button data-kind="video">動画</button><button data-kind="image">静止画</button><button data-kind="audio">音声</button></div><div class="asset-sort"><select id="assetSort" aria-label="素材の並び順"><option value="recent">追加順</option><option value="name">名前順</option></select><button id="removeUnusedAssets" title="未使用素材だけを一覧から外す">未使用を整理</button></div></div><div id="mediaList" class="media-list"></div><button id="importSide" class="media-drop"><span>＋</span>素材を追加<small>動画 · 静止画 · 音声</small></button><div class="media-bottom"><span id="mediaCount">0 FILES</span><span>LOCAL ONLY</span></div><div class="intent-box"><label for="intent">EDITORIAL INTENT</label><select id="intent"><option>HIGH FASHION</option><option>RAW</option><option>CINEMATIC</option><option>CLUB</option><option>DOCUMENTARY</option></select><p id="intentHint">静止を長く。動きに強いコントラストを。</p></div></aside>
<section class="viewer-panel"><div class="viewer-top"><span id="viewerTitle">SOURCE MONITOR</span><div><span id="viewerMode">NO MEDIA</span><button id="compare" class="quiet" title="押している間、カラー補正前を表示">比較</button><button id="fullscreen" class="icon-button" title="フルスクリーン" aria-label="フルスクリーン">⛶</button></div></div><div id="stage" class="stage"><div id="picture" class="picture"><canvas id="lowerCanvas"></canvas><canvas id="middleCanvas"></canvas><canvas id="previewCanvas"></canvas><div id="fxOverlay"></div><div id="textOverlay"></div></div><div id="emptyState" class="empty-state"><div class="frame-symbol"><i></i><i></i><i></i><i></i><span>＋</span></div><h1>最初の素材を、ここへ。</h1><p>動画・静止画・音声をまとめて追加</p><div class="empty-actions"><button id="importMain" class="primary">素材を選択</button><button id="emptyDeviceInfo" class="quiet">端末の対応状況</button></div><small>素材は外部へアップロードされません。</small></div><div id="stageNote" class="stage-note" hidden></div></div><div class="viewer-controls"><span id="sourceTime" class="mono">00:00:00.00</span><div class="transport"><button id="prevFrame" title="1フレーム戻る ←" aria-label="1フレーム戻る">❘‹</button><button id="play" class="play-button" title="再生 / 停止 Space" aria-label="再生">▶</button><button id="nextFrame" title="1フレーム進む →" aria-label="1フレーム進む">›❘</button></div><span id="outputDuration" class="mono">00:00:00.00</span></div><div class="viewer-foot"><div id="aspectButtons" class="aspect-buttons"><button data-aspect="Original" class="selected">Original</button><button data-aspect="9:16">9:16</button><button data-aspect="4:5">4:5</button><button data-aspect="1:1">1:1</button><button data-aspect="16:9">16:9</button></div><span id="previewInfo">PREVIEW</span></div></section>
<aside class="inspector"><div class="panel-title"><span id="inspectorTitle">IMPORT</span><span id="selectionLabel">—</span><button id="inspectorExpand" title="設定パネルを広げる／戻す" aria-label="設定パネルを広げる" aria-pressed="false">⤢</button></div><div id="inspectorBody"></div></aside>
<section class="timeline-panel"><div class="timeline-toolbar"><div><span class="section-tag">SEQUENCE</span><button id="undo" class="icon-button" title="元に戻す ⌘Z" aria-label="元に戻す">↶</button><button id="redo" class="icon-button" title="やり直す ⌘⇧Z" aria-label="やり直す">↷</button><span class="divider"></span><button id="copyClip" class="timeline-secondary" title="コピー ⌘C">コピー</button><button id="cutClip" class="timeline-secondary" title="切り取り ⌘X">切り取り</button><button id="pasteClip" class="timeline-secondary" title="選択レイヤーの再生ヘッドへ貼り付け ⌘V">貼り付け</button><button id="pasteAttributes" class="timeline-secondary" title="属性だけをペースト ⌘⇧V">属性ペースト</button><button id="duplicateClip" class="timeline-secondary" title="末尾へ複製 ⌘D">複製</button><button id="snapToggle" class="timeline-secondary" aria-pressed="true" title="境界へ吸着。Altで一時解除">吸着</button><button id="setIn" class="timeline-secondary" title="IN I">I <span>IN</span></button><button id="setOut" class="timeline-secondary" title="OUT O">O <span>OUT</span></button><button id="split" title="分割 S">⊣ <span>分割</span></button><button id="deleteClip" title="削除・空白を残す Delete">⌫ <span>削除</span></button><button id="ripple" title="前詰め削除 Shift+Delete">↤ <span>前詰め</span></button><button id="timelineMore" aria-label="その他のタイムライン操作">その他</button></div><div class="timeline-zoom"><span id="timelineCount">0 CLIPS</span><button id="zoomOut" aria-label="タイムラインを縮小">−</button><input id="timelineZoom" aria-label="タイムライン拡大率" type="range" min="1" max="10" step=".25" value="1"><button id="zoomIn" aria-label="タイムラインを拡大">＋</button></div></div><div class="timeline-layout"><div class="track-labels"><div class="track-labels-inner"><span>TIME</span><span class="fx-label">FX</span><span>V3 <small>UPPER</small></span><span>V2 <small>MIDDLE</small></span><span>V1 <small>BASE</small></span><button id="audioLabel0" data-audiofocus="0">A1</button><button id="audioLabel1" data-audiofocus="1">A2</button><button id="audioLabel2" data-audiofocus="2">A3</button><button id="audioLabel3" data-audiofocus="3">A4</button><span>✧ <small>MOMENTS</small></span></div></div><div id="timelineScroll" class="timeline-scroll"><div id="timelineContent" class="timeline-content"><div id="ruler" class="ruler"></div><div id="effectTrack" class="fx-track"></div><div id="videoTrackTop" class="video-track"></div><div id="videoTrackUpper" class="video-track"></div><div id="videoTrack" class="video-track"></div><div id="audioTracks"><div id="audioTrack0" class="audio-track editable-audio"></div><div id="audioTrack1" class="audio-track editable-audio"></div><div id="audioTrack2" class="audio-track editable-audio"></div><div id="audioTrack3" class="audio-track editable-audio"></div></div><div id="markerTrack" class="marker-track"></div><div id="playhead" class="playhead"><span></span></div><div id="timelineEmpty" class="timeline-empty">素材を追加すると、ここにシーケンスが表示されます。</div></div></div></div><div class="timeline-footer"><span id="statusLine">編集の準備ができています。</span><button id="shortcuts">KEYBOARD SHORTCUTS <kbd>?</kbd></button></div></section>
</main><video id="sourceVideo" playsinline preload="metadata" hidden></video><audio id="bgmAudio" preload="metadata"></audio><input id="filePicker" type="file" accept="video/*,audio/*,image/jpeg,image/png,image/webp,.mov,.mp4,.m4v,.mkv,.jpg,.jpeg,.png,.webp,.wav,.mp3,.m4a,.flac" multiple hidden><input id="projectPicker" type="file" accept=".project,.json" hidden><input id="bgmPicker" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.aiff" multiple hidden><div id="toast" class="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><script type="module" src="app.js?v=1.7.1"></script></body></html>
